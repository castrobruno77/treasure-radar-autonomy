name: Bounded DMarket Query Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Read-only Mirage 2021 sample
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DMARKET_PUBLIC_KEY: ${{ secrets.DMARKET_PUBLIC_KEY }}
      DMARKET_SECRET_KEY: ${{ secrets.DMARKET_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run bounded read-only diagnostic
        run: node scripts/check-dmarket-query.mjs
