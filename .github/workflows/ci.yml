name: CI

on:
  push:
    branches: ["main", "bootstrap/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension scaffold
        run: |
          node scripts/validate.mjs
          node --check extension/popup.js
          node --check extension/background.js
          node --check extension/options.js
          node tests/options.test.mjs
          node tests/opportunity-contract.test.mjs
          node tests/health-state.test.mjs
          node --test tests/*.test.mjs
      - name: Chromium popup smoke
        run: node scripts/popup-chromium-smoke.mjs
  registry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Canonical registry and runtime contracts (offline)
        run: node --test tests/collection-registry.test.mjs tests/registry-runtime.test.mjs
  adaptive-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Adaptive planning and durable refresh integration (offline)
        run: node --test tests/adaptive-scan-plan.test.mjs tests/refresh.test.mjs tests/telemetry.test.mjs tests/registry-runtime.test.mjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only
      PGDATABASE: radar_test
    steps:
      - uses: actions/checkout@v4
      - name: Real Postgres lease, fencing, TTL, backoff, retention and access tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/refresh-schema-setup.sql
          psql -v ON_ERROR_STOP=1 -f tests/refresh-database.sql
          python3 tests/refresh-concurrency.py
