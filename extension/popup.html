<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Treasure Skins Radar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Treasure Skins Radar</h1>
      <span id="status">Inicializando…</span>
    </header>
    <section class="card">
      <strong>Oportunidades certificadas</strong>
      <p>Comparador robusto + dados frescos.</p>
    </section>
    <section id="auth-required" class="card auth-card" hidden>
      <strong>Login necessário</strong>
      <p>Entre com Steam para acessar o Treasure Radar.</p>
      <button id="steam-login" type="button">Entrar com Steam</button>
      <p id="auth-message" role="status" aria-live="polite"></p>
    </section>
    <section id="opportunities" aria-live="polite"></section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
